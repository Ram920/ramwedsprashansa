<script>

const W = {

 '<p class="fam rv"><b>Invitation from</b><br>'+esc(H.groomParents)+'<br>'+esc(H.groomGrand)+'</p>'+
 '<p class="fam rv"><b>Bride’s parents</b><br>'+esc(H.brideParents)+'</p>'+
 '<p class="fam rv"><b>With blessings of</b><br>'+esc(H.elders)+'<br><i>'+esc(H.remembrance)+'</i></p>'+
 '<p class="fam rv"><b>Eagerly awaiting your presence</b><br>'+esc(H.family)+'<br>and all friends &amp; relatives</p>'+
 '<p class="fam rv"><b>'+esc(C.name)+'</b><br>'+esc(C.address)+'</p>'+(W.hashtag?'<p class="fam">'+esc(W.hashtag)+'</p>':"");
const acts=$("#acts");
C.phones.forEach((p,i)=>{const a=E("a","btn"+(i?" ghost":""),"Call "+(i?"(alt) ":"")+esc(p));a.href="tel:+91"+p;acts.append(a)});

const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)};

/* intro */
const intro=$("#intro"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.body.style.overflow="hidden";
const finish=()=>{intro.classList.add("gone");document.body.style.overflow="";$("#top").scrollIntoView()};
let audio=null;
if(W.music){audio=new Audio(W.music);audio.loop=true;audio.preload='none';
 const mb=E('button','','♪');mb.id='music';mb.type='button';document.body.append(mb);
 const sync=()=>{const p=!audio.paused;mb.classList.toggle('on',p);mb.textContent=p?'❚❚':'♪';mb.setAttribute('aria-label',p?'Pause background music':'Play background music')};
 audio.onplay=audio.onpause=sync;sync();
 audio.onerror=()=>{mb.hidden=true};
 mb.onclick=()=>audio.paused?audio.play().catch(()=>toast('Music could not be played')):audio.pause()}
const startMusic=()=>{if(audio&&audio.paused)audio.play().catch(()=>{})};
$('#openBtn').onclick=()=>{startMusic();intro.classList.add('open');setTimeout(finish,reduce?50:1500)};

$("#openBtn").focus();

/* countdown (hidden if missing, invalid or past) */
(function(){const t=Date.parse(W.countdownTo);if(!W.countdownTo||isNaN(t)||t<=Date.now())return;
 $("#countWrap").hidden=false;$("#capt").textContent=W.countdownLabel||"";
 const f=()=>{let d=Math.max(0,t-Date.now());if(!d){$("#countWrap").hidden=true;clearInterval(iv);return}
  const s=Math.floor(d/1e3);$("#cd").textContent=Math.floor(s/86400);$("#ch").textContent=Math.floor(s%86400/3600);$("#cm").textContent=Math.floor(s%3600/60);$("#cs").textContent=s%60};
 f();const iv=setInterval(f,1000)})();

/* soft falling petals + royal details */
$('#gf').src=IM.ganesh;document.documentElement.style.setProperty('--cnimg','url('+IM.corner+')');
(function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const L=$('#petals'),C=['#e9a33a','#d9788a','#f1cf80','#c9a24a','#e8b4a8'];
for(let i=0;i<18;i++){const p=E('i','pl'),s=9+Math.random()*9;p.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s*1.25+'px;background:'+C[i%5]+';animation-duration:'+(12+Math.random()*10)+'s;animation-delay:-'+Math.random()*20+'s;--dx:'+(Math.random()*120-60)+'px;--r:'+(240+Math.random()*360)+'deg';L.append(p)}})();
/* nav highlights the ceremony in view */
const CL={tilak:'#8a1c2c',haldi:'#a86b00',baraat:'#b3151f',wedding:'#7a1030'},na={};
document.querySelectorAll('nav a').forEach(a=>{const id=a.getAttribute('href').slice(1);na[id]=a;a.style.setProperty('--c',CL[id]||'#6b1220')});
const io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){Object.values(na).forEach(a=>a.classList.remove('on'));if(na[e.target.id])na[e.target.id].classList.add('on')}}),{rootMargin:'-40% 0px -50% 0px'});
document.querySelectorAll('.ev').forEach(s=>io2.observe(s));
/* scroll cue: shows after the intro, one tap scrolls one screen, then it disappears */
const cue=$('#cue'),hideCue=()=>{cue.hidden=true};
cue.onclick=()=>{scrollBy({top:innerHeight*.85,behavior:reduce?'auto':'smooth'});hideCue()};
new MutationObserver(()=>{if(intro.classList.contains('gone'))setTimeout(()=>{if(scrollY<40)cue.hidden=false},1500)}).observe(intro,{attributes:true,attributeFilter:['class']});
addEventListener('scroll',()=>{if(scrollY>60)hideCue()},{passive:true});
/* reveal once + progress */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
addEventListener("scroll",()=>{const h=document.documentElement;$("#bar").style.width=(scrollY/(h.scrollHeight-innerHeight||1)*100)+"%"},{passive:true});
</script>
</body>
</html>
